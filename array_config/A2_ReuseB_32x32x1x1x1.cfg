# Systolic array configuration (Grouped ReuseB 32x32x1x1x1)
# Same as the directory name A2_ReuseB_32x32x1x1x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe

kind                     : Grouped
dataflow                 : ReuseB
outerPeRow               : 32
outerPeCol               : 32
localPeRow               : 1
localPeCol               : 1
multPerPe                : 1

