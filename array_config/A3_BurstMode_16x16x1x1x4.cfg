# Systolic array configuration (ToroidalDual ReuseB 16x16x1x1x4)
# Same as the directory name A3_BurstMode_16x16x1x1x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 16
outerPeCol               : 16
localPeRow               : 1
localPeCol               : 1
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 17.009000
arrayInternalPower       : 564.177000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6620000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1370205.728605
