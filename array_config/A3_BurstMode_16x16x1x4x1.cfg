# Systolic array configuration (ToroidalDual ReuseB 16x16x1x4x1)
# Same as the directory name A3_BurstMode_16x16x1x4x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 16
outerPeCol               : 16
localPeRow               : 1
localPeCol               : 4
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 18.225000
arrayInternalPower       : 701.285000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 8240000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1694912.412581
