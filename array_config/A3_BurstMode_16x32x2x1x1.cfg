# Systolic array configuration (ToroidalDual ReuseB 16x32x2x1x1)
# Same as the directory name A3_BurstMode_16x32x2x1x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 16
outerPeCol               : 32
localPeRow               : 2
localPeCol               : 1
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 18.145000
arrayInternalPower       : 677.112000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 8290000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1694214.732752
