# Systolic array configuration (ToroidalDual ReuseB 1x16x16x1x4)
# Same as the directory name A3_BurstMode_1x16x16x1x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 16
localPeRow               : 16
localPeCol               : 1
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 18.085000
arrayInternalPower       : 462.096000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5890000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1213774.927830
