# Systolic array configuration (ToroidalDual ReuseB 1x16x16x4x1)
# Same as the directory name A3_BurstMode_1x16x16x4x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 16
localPeRow               : 16
localPeCol               : 4
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 18.770000
arrayInternalPower       : 477.181000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6060000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1246041.008277
