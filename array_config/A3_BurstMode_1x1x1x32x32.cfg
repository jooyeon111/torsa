# Systolic array configuration (ToroidalDual ReuseB 1x1x1x32x32)
# Same as the directory name A3_BurstMode_1x1x1x32x32:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 1
localPeRow               : 1
localPeCol               : 32
multPerPe                : 32

# Array power parameters
arraySwitchPower         : 19.327000
arrayInternalPower       : 462.736000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5870000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1207591.927309
