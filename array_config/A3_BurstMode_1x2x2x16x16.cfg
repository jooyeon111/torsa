# Systolic array configuration (ToroidalDual ReuseB 1x2x2x16x16)
# Same as the directory name A3_BurstMode_1x2x2x16x16:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 2
localPeRow               : 2
localPeCol               : 16
multPerPe                : 16

# Array power parameters
arraySwitchPower         : 18.654000
arrayInternalPower       : 459.385000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5810000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1194339.607232
