# Systolic array configuration (ToroidalDual ReuseB 1x2x2x32x8)
# Same as the directory name A3_BurstMode_1x2x2x32x8:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 2
localPeRow               : 2
localPeCol               : 32
multPerPe                : 8

# Array power parameters
arraySwitchPower         : 18.643000
arrayInternalPower       : 457.655000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5770000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1188672.847247
