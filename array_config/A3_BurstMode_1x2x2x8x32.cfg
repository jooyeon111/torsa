# Systolic array configuration (ToroidalDual ReuseB 1x2x2x8x32)
# Same as the directory name A3_BurstMode_1x2x2x8x32:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 2
localPeRow               : 2
localPeCol               : 8
multPerPe                : 32

# Array power parameters
arraySwitchPower         : 18.044000
arrayInternalPower       : 458.173000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5830000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1199163.247274
