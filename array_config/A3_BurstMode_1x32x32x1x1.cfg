# Systolic array configuration (ToroidalDual ReuseB 1x32x32x1x1)
# Same as the directory name A3_BurstMode_1x32x32x1x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 32
localPeRow               : 32
localPeCol               : 1
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 18.445000
arrayInternalPower       : 482.936000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6250000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1279222.928762
