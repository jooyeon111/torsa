# Systolic array configuration (ToroidalDual ReuseB 1x4x4x16x4)
# Same as the directory name A3_BurstMode_1x4x4x16x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 4
localPeRow               : 4
localPeCol               : 16
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 18.548000
arrayInternalPower       : 458.915000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5770000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1188108.727336
