# Systolic array configuration (ToroidalDual ReuseB 1x4x4x2x32)
# Same as the directory name A3_BurstMode_1x4x4x2x32:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 4
localPeRow               : 4
localPeCol               : 2
multPerPe                : 32

# Array power parameters
arraySwitchPower         : 18.380000
arrayInternalPower       : 463.277000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5840000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1202131.807437
