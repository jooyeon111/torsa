# Systolic array configuration (ToroidalDual ReuseB 1x4x4x32x2)
# Same as the directory name A3_BurstMode_1x4x4x32x2:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 4
localPeRow               : 4
localPeCol               : 32
multPerPe                : 2

# Array power parameters
arraySwitchPower         : 18.444000
arrayInternalPower       : 458.947000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5740000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1186343.647544
