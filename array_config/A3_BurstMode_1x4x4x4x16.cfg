# Systolic array configuration (ToroidalDual ReuseB 1x4x4x4x16)
# Same as the directory name A3_BurstMode_1x4x4x4x16:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 4
localPeRow               : 4
localPeCol               : 4
multPerPe                : 16

# Array power parameters
arraySwitchPower         : 18.527000
arrayInternalPower       : 460.410000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5810000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1194941.527285
