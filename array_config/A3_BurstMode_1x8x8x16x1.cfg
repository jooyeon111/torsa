# Systolic array configuration (ToroidalDual ReuseB 1x8x8x16x1)
# Same as the directory name A3_BurstMode_1x8x8x16x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 8
localPeRow               : 8
localPeCol               : 16
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 18.899000
arrayInternalPower       : 470.417000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5890000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1216882.448083
