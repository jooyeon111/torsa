# Systolic array configuration (ToroidalDual ReuseB 1x8x8x1x16)
# Same as the directory name A3_BurstMode_1x8x8x1x16:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 8
localPeRow               : 8
localPeCol               : 1
multPerPe                : 16

# Array power parameters
arraySwitchPower         : 18.725000
arrayInternalPower       : 464.909000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5860000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1206455.047667
