# Systolic array configuration (ToroidalDual ReuseB 1x8x8x4x4)
# Same as the directory name A3_BurstMode_1x8x8x4x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 1
outerPeCol               : 8
localPeRow               : 8
localPeCol               : 4
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 17.665000
arrayInternalPower       : 457.040000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5810000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1197272.527437
