# Systolic array configuration (ToroidalDual ReuseB 2x16x8x1x4)
# Same as the directory name A3_BurstMode_2x16x8x1x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 16
localPeRow               : 8
localPeCol               : 1
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 18.935000
arrayInternalPower       : 504.399000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6390000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1309557.608751
