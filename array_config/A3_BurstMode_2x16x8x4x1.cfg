# Systolic array configuration (ToroidalDual ReuseB 2x16x8x4x1)
# Same as the directory name A3_BurstMode_2x16x8x4x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 16
localPeRow               : 8
localPeCol               : 4
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 20.469000
arrayInternalPower       : 607.998000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 7770000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1575754.931453
