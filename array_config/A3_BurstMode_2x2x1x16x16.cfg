# Systolic array configuration (ToroidalDual ReuseB 2x2x1x16x16)
# Same as the directory name A3_BurstMode_2x2x1x16x16:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 2
localPeRow               : 1
localPeCol               : 16
multPerPe                : 16

# Array power parameters
arraySwitchPower         : 18.677000
arrayInternalPower       : 469.913000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5910000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1217165.407453
