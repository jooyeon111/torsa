# Systolic array configuration (ToroidalDual ReuseB 2x2x1x32x8)
# Same as the directory name A3_BurstMode_2x2x1x32x8:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 2
localPeRow               : 1
localPeCol               : 32
multPerPe                : 8

# Array power parameters
arraySwitchPower         : 18.971000
arrayInternalPower       : 477.069000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5960000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1229451.487664
