# Systolic array configuration (ToroidalDual ReuseB 2x2x1x8x32)
# Same as the directory name A3_BurstMode_2x2x1x8x32:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 2
localPeRow               : 1
localPeCol               : 8
multPerPe                : 32

# Array power parameters
arraySwitchPower         : 18.110000
arrayInternalPower       : 466.433000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5900000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1214076.607413
