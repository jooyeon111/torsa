# Systolic array configuration (ToroidalDual ReuseB 2x32x16x1x1)
# Same as the directory name A3_BurstMode_2x32x16x1x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 32
localPeRow               : 16
localPeCol               : 1
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 20.974000
arrayInternalPower       : 620.338000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 7980000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1614643.931965
