# Systolic array configuration (ToroidalDual ReuseB 2x4x2x16x4)
# Same as the directory name A3_BurstMode_2x4x2x16x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 4
localPeRow               : 2
localPeCol               : 16
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 19.076000
arrayInternalPower       : 495.884000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6190000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1273394.168162
