# Systolic array configuration (ToroidalDual ReuseB 2x4x2x2x32)
# Same as the directory name A3_BurstMode_2x4x2x2x32:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 4
localPeRow               : 2
localPeCol               : 2
multPerPe                : 32

# Array power parameters
arraySwitchPower         : 18.282000
arrayInternalPower       : 474.127000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5940000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1222126.207621
