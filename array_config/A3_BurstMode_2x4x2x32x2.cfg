# Systolic array configuration (ToroidalDual ReuseB 2x4x2x32x2)
# Same as the directory name A3_BurstMode_2x4x2x32x2:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 4
localPeRow               : 2
localPeCol               : 32
multPerPe                : 2

# Array power parameters
arraySwitchPower         : 19.642000
arrayInternalPower       : 528.234000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6540000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1346801.769114
