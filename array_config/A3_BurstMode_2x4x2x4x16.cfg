# Systolic array configuration (ToroidalDual ReuseB 2x4x2x4x16)
# Same as the directory name A3_BurstMode_2x4x2x4x16:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 4
localPeRow               : 2
localPeCol               : 4
multPerPe                : 16

# Array power parameters
arraySwitchPower         : 18.502000
arrayInternalPower       : 472.854000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5940000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1222139.167560
