# Systolic array configuration (ToroidalDual ReuseB 2x8x4x16x1)
# Same as the directory name A3_BurstMode_2x8x4x16x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 8
localPeRow               : 4
localPeCol               : 16
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 21.303000
arrayInternalPower       : 604.133000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 7540000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1536646.691153
