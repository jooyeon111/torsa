# Systolic array configuration (ToroidalDual ReuseB 2x8x4x1x16)
# Same as the directory name A3_BurstMode_2x8x4x1x16:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 8
localPeRow               : 4
localPeCol               : 1
multPerPe                : 16

# Array power parameters
arraySwitchPower         : 18.720000
arrayInternalPower       : 480.832000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6020000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1239019.207972
