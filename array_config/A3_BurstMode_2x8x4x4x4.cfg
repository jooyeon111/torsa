# Systolic array configuration (ToroidalDual ReuseB 2x8x4x4x4)
# Same as the directory name A3_BurstMode_2x8x4x4x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 2
outerPeCol               : 8
localPeRow               : 4
localPeCol               : 4
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 18.009000
arrayInternalPower       : 494.363000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6270000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1288600.568312
