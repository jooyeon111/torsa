# Systolic array configuration (ToroidalDual ReuseB 32x32x1x1x1)
# Same as the directory name A3_BurstMode_32x32x1x1x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 32
outerPeCol               : 32
localPeRow               : 1
localPeCol               : 1
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 18.586000
arrayInternalPower       : 766.022000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 8460000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1742450.771382
