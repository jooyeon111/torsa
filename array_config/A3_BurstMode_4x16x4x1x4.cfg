# Systolic array configuration (ToroidalDual ReuseB 4x16x4x1x4)
# Same as the directory name A3_BurstMode_4x16x4x1x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 16
localPeRow               : 4
localPeCol               : 1
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 18.475000
arrayInternalPower       : 511.163000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6430000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1319375.888834
