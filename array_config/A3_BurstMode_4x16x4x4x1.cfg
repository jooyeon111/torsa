# Systolic array configuration (ToroidalDual ReuseB 4x16x4x4x1)
# Same as the directory name A3_BurstMode_4x16x4x4x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 16
localPeRow               : 4
localPeCol               : 4
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 19.601000
arrayInternalPower       : 612.462000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 7800000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1584886.331532
