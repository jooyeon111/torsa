# Systolic array configuration (ToroidalDual ReuseB 4x32x8x1x1)
# Same as the directory name A3_BurstMode_4x32x8x1x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 32
localPeRow               : 8
localPeCol               : 1
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 20.519000
arrayInternalPower       : 624.888000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 8000000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1621001.172055
