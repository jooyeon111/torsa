# Systolic array configuration (ToroidalDual ReuseB 4x4x1x16x4)
# Same as the directory name A3_BurstMode_4x4x1x16x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 4
localPeRow               : 1
localPeCol               : 16
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 18.712000
arrayInternalPower       : 504.046000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6240000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1284947.648274
