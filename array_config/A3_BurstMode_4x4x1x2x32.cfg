# Systolic array configuration (ToroidalDual ReuseB 4x4x1x2x32)
# Same as the directory name A3_BurstMode_4x4x1x2x32:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 4
localPeRow               : 1
localPeCol               : 2
multPerPe                : 32

# Array power parameters
arraySwitchPower         : 17.846000
arrayInternalPower       : 486.812000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6010000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1239041.167764
