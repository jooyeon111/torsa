# Systolic array configuration (ToroidalDual ReuseB 4x4x1x32x2)
# Same as the directory name A3_BurstMode_4x4x1x32x2:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 4
localPeRow               : 1
localPeCol               : 32
multPerPe                : 2

# Array power parameters
arraySwitchPower         : 19.259000
arrayInternalPower       : 542.739000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6620000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1365184.089278
