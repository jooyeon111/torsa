# Systolic array configuration (ToroidalDual ReuseB 4x4x1x4x16)
# Same as the directory name A3_BurstMode_4x4x1x4x16:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 4
localPeRow               : 1
localPeCol               : 4
multPerPe                : 16

# Array power parameters
arraySwitchPower         : 18.063000
arrayInternalPower       : 480.005000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 5980000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1232522.647648
