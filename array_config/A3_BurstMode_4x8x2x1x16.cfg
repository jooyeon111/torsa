# Systolic array configuration (ToroidalDual ReuseB 4x8x2x1x16)
# Same as the directory name A3_BurstMode_4x8x2x1x16:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 8
localPeRow               : 2
localPeCol               : 1
multPerPe                : 16

# Array power parameters
arraySwitchPower         : 18.226000
arrayInternalPower       : 493.135000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6090000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1255787.288111
