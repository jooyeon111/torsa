# Systolic array configuration (ToroidalDual ReuseB 4x8x2x4x4)
# Same as the directory name A3_BurstMode_4x8x2x4x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 8
localPeRow               : 2
localPeCol               : 4
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 18.080000
arrayInternalPower       : 502.911000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6310000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1296979.928395
