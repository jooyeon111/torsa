# Systolic array configuration (ToroidalDual ReuseB 8x16x2x1x4)
# Same as the directory name A3_BurstMode_8x16x2x1x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 8
outerPeCol               : 16
localPeRow               : 2
localPeCol               : 1
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 17.105000
arrayInternalPower       : 524.612000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6520000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1342541.169033
