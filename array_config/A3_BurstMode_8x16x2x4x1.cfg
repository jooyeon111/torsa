# Systolic array configuration (ToroidalDual ReuseB 8x16x2x4x1)
# Same as the directory name A3_BurstMode_8x16x2x4x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 8
outerPeCol               : 16
localPeRow               : 2
localPeCol               : 4
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 20.054000
arrayInternalPower       : 644.182000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 7930000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1616557.331836
