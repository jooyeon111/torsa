# Systolic array configuration (ToroidalDual ReuseB 8x32x4x1x1)
# Same as the directory name A3_BurstMode_8x32x4x1x1:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 8
outerPeCol               : 32
localPeRow               : 4
localPeCol               : 1
multPerPe                : 1

# Array power parameters
arraySwitchPower         : 18.841000
arrayInternalPower       : 635.484000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 8080000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1643390.652276
