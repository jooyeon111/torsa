# Systolic array configuration (ToroidalDual ReuseB 8x8x1x4x4)
# Same as the directory name A3_BurstMode_8x8x1x4x4:
#   outerPeRow x outerPeCol x localPeRow x localPeCol x multPerPe
# ToroidalDual is fixed to ReuseB, so dataflow is omitted.

kind                     : ToroidalDual
outerPeRow               : 8
outerPeCol               : 8
localPeRow               : 1
localPeCol               : 4
multPerPe                : 4

# Array power parameters
arraySwitchPower         : 17.281000
arrayInternalPower       : 519.529000
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 6410000.000000

# Array area parameter (um^2, whole array)
arrayArea                : 1320455.528604
