# Systolic array configuration (ToroidalDual ReuseB)
# Equivalent to the ToroidalDualConfig(4, 4, 1, 1, 2, 4) formerly hard-coded in main.cpp.
# ToroidalDual additionally requires a burst SRAM input (inputBurstSRAM) as a separate argument.
# dataflow is fixed to ReuseB, so it does not need to be specified.

kind                     : ToroidalDual
outerPeRow               : 4
outerPeCol               : 4
localPeRow               : 1
localPeCol               : 1
multPerPe                : 2

# Array power parameters
arraySwitchPower         : 1.0
arrayInternalPower       : 1.0
arrayClockPowerFraction  : 0.400000
arrayLeakagePower        : 1.0

# Array area parameter (um^2, whole array)
arrayArea                : 1.0
